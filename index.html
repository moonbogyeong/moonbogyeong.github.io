<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>별빛 수집가</title>
<style>
  :root { color-scheme: dark; --cyan:#77f5ff; --pink:#ff77c8; --bg:#090d22; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:18px;
    font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif; color:#f7f7ff;
    background:radial-gradient(ellipse at 50% 0%,#222c60 0%,#101633 40%,#070a18 100%); }
  .wrap { width:min(100%,520px); }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:12px; }
  h1 { margin:0; font-size:clamp(22px,5vw,30px); letter-spacing:-1px; }
  h1 span { color:var(--cyan); }
  .stats { display:flex; gap:8px; }
  .stat { background:#ffffff0d; border:1px solid #ffffff20; border-radius:12px; padding:8px 12px; min-width:76px; text-align:center; }
  .stat small { display:block; color:#aeb8e6; font-size:11px; }
  .stat strong { font-size:20px; }
  .gamebox { position:relative; overflow:hidden; border:1px solid #8fa4ff50; border-radius:20px; box-shadow:0 20px 70px #0008,0 0 35px #4d7dff18; }
  canvas { display:block; width:100%; aspect-ratio:4/5; background:#080d25; touch-action:none; }
  .overlay { position:absolute; inset:0; display:grid; place-items:center; padding:26px; text-align:center;
    background:linear-gradient(#080d25b8,#080d25df); }
  .overlay.hidden { display:none; }
  .panel { max-width:330px; }
  .eyebrow { color:var(--cyan); font-weight:800; letter-spacing:3px; font-size:11px; }
  .panel h2 { font-size:32px; margin:8px 0; letter-spacing:-1px; }
  .panel p { color:#c6ccef; line-height:1.65; margin:10px 0 20px; font-size:14px; }
  button { border:0; cursor:pointer; color:#071021; font-weight:850; font-size:15px; padding:13px 24px; border-radius:999px;
    background:linear-gradient(100deg,var(--cyan),#b9ffdf); box-shadow:0 6px 25px #77f5ff30; }
  button:active { transform:scale(.97); }
  .hint { display:flex; justify-content:space-between; gap:10px; color:#aeb8e6; font-size:12px; padding:12px 4px 0; }
  .hint b { color:#fff; }
  .mobile { display:none; justify-content:center; gap:14px; margin-top:12px; }
  .mobile button { width:72px; height:48px; padding:0; font-size:22px; background:#ffffff12; border:1px solid #ffffff25; color:white; box-shadow:none; }
  @media (pointer:coarse) { .mobile { display:flex; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1>별빛 <span>수집가</span> ✦</h1>
    <div class="stats">
      <div class="stat"><small>점수</small><strong id="score">0</strong></div>
      <div class="stat"><small>최고 점수</small><strong id="best">0</strong></div>
    </div>
  </header>
  <section class="gamebox">
    <canvas id="game" width="480" height="600" aria-label="별빛 수집 게임"></canvas>
    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="eyebrow">COSMIC ARCADE</div>
        <h2 id="headline">별빛을 모아봐! ✨</h2>
        <p id="message">반짝이는 별을 모으고, 붉은 운석은 피하세요.<br>오래 버틸수록 운석이 점점 빨라져요.</p>
        <button id="start">게임 시작</button>
      </div>
    </div>
  </section>
  <div class="hint"><span>이동 <b>← →</b> 또는 <b>A / D</b></span><span>별 +10 · 운석에 닿으면 종료</span></div>
  <div class="mobile"><button id="left" aria-label="왼쪽">←</button><button id="right" aria-label="오른쪽">→</button></div>
</main>
<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay'), headline = document.getElementById('headline');
  const message = document.getElementById('message'), startBtn = document.getElementById('start');
  const W = canvas.width, H = canvas.height;
  let running = false, score = 0, best = Number(localStorage.getItem('starCollectorBest') || 0);
  let player, stars, rocks, particles, bgStars, keys = {}, spawnTick = 0, frame = 0, last = 0;
  bestEl.textContent = best;
  const rand = (a,b) => a + Math.random()*(b-a);

  function reset() {
    score = 0; frame = 0; spawnTick = 0;
    player = { x:W/2, y:H-65, r:16, speed:5.8 };
    stars = []; rocks = []; particles = [];
    bgStars = Array.from({length:75}, () => ({x:rand(0,W),y:rand(0,H),r:rand(.5,1.8),v:rand(.4,1.5),a:rand(.2,.8)}));
    scoreEl.textContent = score;
  }
  function start() {
    reset(); running = true; overlay.classList.add('hidden'); last = performance.now();
    requestAnimationFrame(loop);
  }
  function end() {
    running = false;
    if (score > best) { best = score; localStorage.setItem('starCollectorBest', best); bestEl.textContent = best; }
    headline.textContent = '우주 탐험 종료 💫';
    message.innerHTML = `최종 점수는 <b style="color:#77f5ff">${score}점</b>!<br>${score >= best && score > 0 ? '새로운 최고 기록일지도 몰라요. 멋져요!' : '다시 도전해서 기록을 깨보세요.'}`;
    startBtn.textContent = '다시 도전';
    overlay.classList.remove('hidden');
  }
  function burst(x,y,color,n=10) {
    for(let i=0;i<n;i++) particles.push({x,y,vx:rand(-2.5,2.5),vy:rand(-2.8,2.2),life:rand(18,35),max:35,color,r:rand(1,3)});
  }
  function spawn() {
    if (Math.random() < .72) stars.push({x:rand(24,W-24),y:-20,r:rand(8,12),v:rand(2.2,3.4)+score*.002,rot:rand(0,6)});
    else rocks.push({x:rand(24,W-24),y:-30,r:rand(13,21),v:rand(2.4,3.7)+score*.003,rot:rand(0,6),spin:rand(-.04,.04)});
  }
  function starShape(x,y,r,rot=0) {
    ctx.beginPath();
    for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?r*.43:r; const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
    ctx.closePath();
  }
  function drawPlayer() {
    ctx.save(); ctx.translate(player.x,player.y);
    ctx.shadowBlur=22; ctx.shadowColor='#77f5ff';
    ctx.fillStyle='#a6fcff'; ctx.beginPath(); ctx.moveTo(0,-20); ctx.lineTo(15,13); ctx.lineTo(0,8); ctx.lineTo(-15,13); ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0; ctx.fillStyle='#536fff'; ctx.beginPath(); ctx.moveTo(-5,12);ctx.lineTo(0,24+Math.sin(frame*.45)*4);ctx.lineTo(5,12);ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath();ctx.arc(0,-2,4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  function loop(now) {
    if (!running) return;
    const dt = Math.min((now-last)/16.67,2); last = now; frame++;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  function update(dt) {
    if(keys.ArrowLeft||keys.a||keys.A) player.x -= player.speed*dt;
    if(keys.ArrowRight||keys.d||keys.D) player.x += player.speed*dt;
    player.x = Math.max(20,Math.min(W-20,player.x));
    bgStars.forEach(s=>{s.y+=s.v*dt;if(s.y>H){s.y=0;s.x=rand(0,W);}});
    spawnTick += dt;
    if(spawnTick > Math.max(18,43-score*.035)){spawn();spawnTick=0;}
    for(let i=stars.length-1;i>=0;i--){
      const s=stars[i]; s.y+=s.v*dt;s.rot+=.025*dt;
      if(Math.hypot(s.x-player.x,s.y-player.y)<s.r+player.r){score+=10;scoreEl.textContent=score;burst(s.x,s.y,'#ffe88a',12);stars.splice(i,1);}
      else if(s.y>H+30) stars.splice(i,1);
    }
    for(let i=rocks.length-1;i>=0;i--){
      const r=rocks[i];r.y+=r.v*dt;r.rot+=r.spin*dt;
      if(Math.hypot(r.x-player.x,r.y-player.y)<r.r+player.r*.65){burst(player.x,player.y,'#ff77c8',25);draw();end();return;}
      if(r.y>H+40) rocks.splice(i,1);
    }
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1);}
  }
  function draw() {
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101a43');g.addColorStop(1,'#080b20');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    bgStars.forEach(s=>{ctx.globalAlpha=s.a;ctx.fillStyle='#d8e8ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
    // faint orbital arcs
    ctx.strokeStyle='#758cff12';ctx.lineWidth=1;
    for(let y=90;y<H;y+=105){ctx.beginPath();ctx.ellipse(W/2,y,W*.55,27,0,0,Math.PI*2);ctx.stroke();}
    stars.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);ctx.shadowBlur=18;ctx.shadowColor='#ffe88a';ctx.fillStyle='#ffe88a';starShape(0,0,s.r);ctx.fill();ctx.restore();});
    rocks.forEach(r=>{ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.shadowBlur=12;ctx.shadowColor='#ff477e';ctx.fillStyle='#ff648e';ctx.strokeStyle='#ffb1c8';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<9;i++){let a=i*Math.PI*2/9,rr=r.r*(i%2?.8:1);let x=Math.cos(a)*rr,y=Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();});
    particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});ctx.globalAlpha=1;
    if(player) drawPlayer();
  }
  document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if(!running&&e.key===' ')start();});
  document.addEventListener('keyup',e=>keys[e.key]=false);
  startBtn.addEventListener('click',start);
  function holdButton(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;});['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false));}
  holdButton('left','ArrowLeft');holdButton('right','ArrowRight');
  canvas.addEventListener('pointermove',e=>{if(running&&e.pointerType!=='mouse') {const rect=canvas.getBoundingClientRect();player.x=(e.clientX-rect.left)/rect.width*W;}});
  reset(); draw();
})();
</script>
</body>
</html>
