<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 | 문보경</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0914;
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        /* 배경 그라데이션 번짐 효과 */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.25) 0%, rgba(236, 72, 153, 0.15) 50%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            filter: blur(60px);
        }
        /* 레이아웃 메인 컨테이너 */
        .container {
            max-width: 1100px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 50px;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
                text-align: center;
            }
        }
        /* 왼쪽: 설명 및 내용 영역 */
        .left-content {
            flex: 1;
        }
        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #d8b4fe;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
        h1 span {
            background: linear-gradient(135deg, #c084fc 0%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* 클릭할 때마다 바뀌는 상세 설명 박스 */
        .detail-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            text-align: left;
            min-height: 140px;
            transition: all 0.3s ease;
        }
        .detail-box h3 {
            font-size: 1.2rem;
            color: #f472b6;
            margin-bottom: 8px;
        }
        .detail-box p {
            color: #9ca3af;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* 오른쪽: 목업 모바일 화면 영역 */
        .right-device {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .phone-mockup {
            width: 320px;
            height: 580px;
            background: #13111c;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }
        .phone-header {
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #8b5cf6;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 핸드폰 안의 클릭 가능한 버튼/카드들 */
        .interactive-card {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15) 0%, rgba(236, 72, 153, 0.15) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .interactive-card:hover {
            transform: scale(1.03);
            border-color: #f472b6;
        }
        .interactive-card.active {
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
        }
        .card-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="container">
        <!-- 왼쪽 영역: 타이틀 & 선택한 항목 설명 -->
        <div class="left-content">
            <div class="badge">💡 화면 속 요소들을 클릭해보세요!</div>
            <h1>좋아요를 넘어,<br><span>커리어로 나아가다</span></h1>
            
            <!-- 클릭 시 반응하는 설명 박스 -->
            <div class="detail-box" id="detailBox">
                <h3 id="detailTitle">📌 항목을 선택해주세요</h3>
                <p id="detailDesc">오른쪽 핸드폰 화면 안의 카드를 클릭하시면 해당 항목에 대한 상세 정보가 이곳에 나타납니다.</p>
            </div>
        </div>

        <!-- 오른쪽 영역: 핸드폰 인터랙티브 목업 -->
        <div class="right-device">
            <div class="phone-mockup">
                <div class="phone-header">@moonbogyeong</div>

                <!-- 클릭 요소 1 -->
                <div class="interactive-card active" onclick="showContent('contents')">
                    <div>
                        <div class="card-title">🎬 콘텐츠 기획</div>
                        <small style="color: rgba(255,255,255,0.7); font-size: 11px;">클릭하여 보기</small>
                    </div>
                    <span class="card-icon">➔</span>
                </div>

                <!-- 클릭 요소 2 -->
                <div class="interactive-card" onclick="showContent('brand')">
                    <div>
                        <div class="card-title">💼 브랜드 협업</div>
                        <small style="color: rgba(255,255,255,0.7); font-size: 11px;">클릭하여 보기</small>
                    </div>
                    <span class="card-icon">➔</span>
                </div>

                <!-- 클릭 요소 3 -->
                <div class="interactive-card" onclick="showContent('data')">
                    <div>
                        <div class="card-title">📊 데이터 분석</div>
                        <small style="color: rgba(255,255,255,0.7); font-size: 11px;">클릭하여 보기</small>
                    </div>
                    <span class="card-icon">➔</span>
                </div>

            </div>
        </div>
    </div>

    <!-- 클릭 시 내용을 바꾸어주는 자바스크립트 -->
    <script>
        const contentData = {
            'contents': {
                title: '🎬 콘텐츠 기획 (Content Strategy)',
                desc: '트렌디한 숏폼 비디오 및 스토리텔링 중심의 기획을 진행합니다. AI 비디오 제너레이션 툴과 창의적인 스크립트를 활용해 높은 몰입감을 선사합니다.'
            },
            'brand': {
                title: '💼 브랜드 협업 (Brand Collaboration)',
                desc: '브랜드 가치에 맞는 매력적인 비주얼과 메시지를 전달합니다. 다양한 매체를 연결하여 마케팅 효과를 극대화합니다.'
            },
            'data': {
                title: '📊 데이터 분석 (Data Analytics)',
                desc: '단순한 조회수를 넘어 반응율, 유저 행동 데이터 및 도달 범위를 분석하여 효율적인 성과 방향을 제시합니다.'
            }
        };

        function showContent(key) {
            // 내용 변경
            document.getElementById('detailTitle').innerText = contentData[key].title;
            document.getElementById('detailDesc').innerText = contentData[key].desc;

            // 클릭된 카드 스타일 변경
            const cards = document.querySelectorAll('.interactive-card');
            cards.forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // 초기 실행
        showContent('contents');
    </script>
</body>
</html>
